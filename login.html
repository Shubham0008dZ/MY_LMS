<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LMS Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: #1a73e8; margin-bottom: 5px; font-size: 1.8rem; }
        .login-card p { color: #7f8c8d; margin-bottom: 25px; font-size: 0.95rem; }
        .form-group { text-align: left; margin-bottom: 20px; position: relative; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 600; color: #555; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 12px 15px 12px 40px; border: 1px solid #ddd; border-radius: 6px; outline: none; box-sizing: border-box; transition: 0.3s; }
        .form-group input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.1); }
        .form-group i { position: absolute; top: 38px; left: 15px; color: #aaa; }
        .btn-login { width: 100%; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #1557b0; }
        #errorMsg { color: #e74c3c; font-size: 0.9rem; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <i class="fa-solid fa-book-open-reader" style="font-size: 3rem; color: #1a73e8; margin-bottom: 10px;"></i>
        <h2>Library Portal</h2>
        <p>Sign in to access the dashboard</p>

        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <i class="fa-solid fa-user"></i>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Secure Login</button>
            <div id="errorMsg">Invalid credentials. Please try again.</div>
        </form>
    </div>

    <script>
        // YAHAN APNA API URL DAALO
const API_URL = "https://script.google.com/macros/s/AKfycbyE1U8-EgBh-pQHzHM9MtkzBAmzhdYTuqixpOY0i6dbLoTh7-jHsr7xPLccIrOH35Ye/exec"; // APNA URL YAHAN DAALO

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.innerText = "Authenticating...";
            btn.disabled = true;
            errorMsg.style.display = 'none';

            const payload = {
                action: 'login',
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim()
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.success) {
                    // Browser ki memory me save kar lo ki banda login ho gaya hai
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('userName', result.name);
                    sessionStorage.setItem('userRole', result.role);
                    
                    // Main application (index.html) par bhej do
                    window.location.href = 'index.html'; 
                } else {
                    errorMsg.innerText = result.message;
                    errorMsg.style.display = 'block';
                    btn.innerText = "Secure Login";
                    btn.disabled = false;
                }
            } catch (error) {
                errorMsg.innerText = "Connection error. Try again.";
                errorMsg.style.display = 'block';
                btn.innerText = "Secure Login";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
